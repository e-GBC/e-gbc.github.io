    let currentIndex = 0;

    function renderSlide(index) {
      currentIndex = index;
      const slide = slides[index];
      document.getElementById('slide-counter').textContent = `PAGE ${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      document.getElementById('slide-viewport').innerHTML = slide.render();
      document.getElementById('slide-section-badge').textContent = slide.category;
      const selectEl = document.getElementById('slide-select');
      if (selectEl) selectEl.value = index;

      // Update button states
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      if (index === 0) {
        prevBtn.disabled = true;
        prevBtn.classList.add('border-slate-200', 'text-slate-400', 'cursor-not-allowed');
        prevBtn.classList.remove('border-slate-300', 'text-slate-700', 'hover:bg-slate-100');
      } else {
        prevBtn.disabled = false;
        prevBtn.classList.remove('border-slate-200', 'text-slate-400', 'cursor-not-allowed');
        prevBtn.classList.add('border-slate-300', 'text-slate-700', 'hover:bg-slate-100');
      }

      if (index === slides.length - 1) {
        nextBtn.disabled = true;
        nextBtn.classList.add('border-slate-200', 'text-slate-400', 'cursor-not-allowed');
      } else {
        nextBtn.disabled = false;
        nextBtn.classList.remove('border-slate-200', 'text-slate-400', 'cursor-not-allowed');
      }

      // Update dots
      const dotsContainer = document.getElementById('dot-indicators');
      dotsContainer.innerHTML = '';
      slides.forEach((_, idx) => {
        const dot = document.createElement('button');
        dot.className = `h-2.5 rounded-full transition-all ${idx === index ? 'w-8 bg-blue-600' : 'w-2 bg-slate-300 hover:bg-slate-400'}`;
        dot.onclick = () => goToSlide(idx);
        dotsContainer.appendChild(dot);
      });
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        renderSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        renderSlide(currentIndex - 1);
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < slides.length) {
        renderSlide(index);
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        goToSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        goToSlide(slides.length - 1);
      }
    });

    // Populate select options
    const select = document.getElementById('slide-select');
    if (select) {
      slides.forEach((slide, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${String(idx + 1).padStart(2, '0')}. ${slide.title}`;
        select.appendChild(opt);
      });
    }

    // Check if in print/export all mode
    const urlParams = new URLSearchParams(window.location.search);
    const isPrintAll = urlParams.get('print') === 'all';

    if (isPrintAll) {
      document.body.classList.add('is-print-view');
      const main = document.querySelector('main');
      if (main) {
        main.className = 'w-full max-w-none p-0 m-0';
        main.innerHTML = slides.map((s, idx) => `
          <div class="print-page-wrapper">
            <div class="w-full flex-1 flex flex-col justify-start">
              ${s.render()}
            </div>
            <div class="pt-4 mt-auto border-t border-slate-200 flex justify-between items-center text-sm font-bold text-slate-400">
              <span class="tracking-wider">浸信會懷恩堂 ｜ 場地借用管理辦法公告說明</span>
              <span class="font-mono bg-slate-100 text-slate-600 px-3 py-1 rounded-full border border-slate-200">
                ${s.category} ｜ PAGE ${String(idx + 1).padStart(2, '0')} / ${slides.length}
              </span>
            </div>
          </div>
        `).join('');
      }
      const footer = document.querySelector('footer');
      if (footer) footer.style.display = 'none';
      const badge = document.getElementById('slide-section-badge');
      if (badge) badge.style.display = 'none';
    } else {
      // Initial render for normal interactive slide view
      renderSlide(0);
    }
  </script>
