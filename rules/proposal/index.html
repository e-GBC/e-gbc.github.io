    let currentIndex = 0;

    function renderSlide(index) {
      currentIndex = index;
      const slide = slides[index];
      document.getElementById('slide-counter').textContent = `PAGE ${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      document.getElementById('slide-category').textContent = slide.category;
      document.getElementById('slide-viewport').innerHTML = slide.render();
      const selectEl = document.getElementById('slide-select');
      if (selectEl) selectEl.value = index;

      // Update button states
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      if (index === 0) {
        prevBtn.disabled = true;
        prevBtn.classList.add('border-slate-800', 'text-slate-600', 'cursor-not-allowed');
        prevBtn.classList.remove('border-slate-700', 'text-slate-200', 'hover:bg-slate-800');
      } else {
        prevBtn.disabled = false;
        prevBtn.classList.remove('border-slate-800', 'text-slate-600', 'cursor-not-allowed');
        prevBtn.classList.add('border-slate-700', 'text-slate-200', 'hover:bg-slate-800');
      }

      if (index === slides.length - 1) {
        nextBtn.disabled = true;
        nextBtn.classList.add('border-slate-800', 'text-slate-600', 'cursor-not-allowed');
      } else {
        nextBtn.disabled = false;
        nextBtn.classList.remove('border-slate-800', 'text-slate-600', 'cursor-not-allowed');
      }

      // Update dots
      const dotsContainer = document.getElementById('dot-indicators');
      dotsContainer.innerHTML = '';
      slides.forEach((_, idx) => {
        const dot = document.createElement('button');
        dot.className = `h-2.5 rounded-full transition-all ${idx === index ? 'w-8 bg-blue-500' : 'w-2 bg-slate-700 hover:bg-slate-500'}`;
        dot.onclick = () => goToSlide(idx);
        dotsContainer.appendChild(dot);
      });
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        renderSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        renderSlide(currentIndex - 1);
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < slides.length) {
        renderSlide(index);
      }
    }

    function openImageModal() {
      const modal = document.getElementById('image-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        goToSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        goToSlide(slides.length - 1);
      }
    });

    // Populate select options if element exists
    const select = document.getElementById('slide-select');
    if (select) {
      slides.forEach((slide, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${String(idx + 1).padStart(2, '0')}. ${slide.title}`;
        select.appendChild(opt);
      });
    }

    // Initial render
    renderSlide(0);
  </script>
