<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教會全年行事曆</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { 
    --navy: #0D184E;
    --navy-light: #1D2B6C;
    --bg-gray: #F5F6F8;
    --card-bg: #FFFFFF;
  }
  
  * { box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    margin: 0;
    padding: 8px;
    background: var(--bg-gray);
    color: #202124;
    overflow-x: hidden;
  }

  h1.page-title {
    text-align: center;
    color: var(--navy);
    font-size: 20px;
    margin: 0 0 8px 0;
    font-weight: 700;
  }

  /* 導覽列與切換區塊 */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #FFFFFF;
    padding: 6px 12px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    margin-bottom: 8px;
    gap: 8px;
  }

  .nav-center {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-btn {
    border: none;
    background: var(--navy);
    color: white;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    flex-shrink: 0;
  }

  .nav-btn:hover { background: var(--navy-light); }
  .nav-btn:disabled { background: #C7CBE0; cursor: not-allowed; opacity: 0.6; }

  .month-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    cursor: pointer;
    text-decoration: underline dotted;
    white-space: nowrap;
  }

  /* 切換開關 */
  .view-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }

  .toggle-txt {
    font-size: 12px;
    color: var(--navy);
    font-weight: 700;
  }

  .view-toggle input { display: none; }

  .toggle-slider {
    width: 34px;
    height: 18px;
    background: #C7CBE0;
    border-radius: 999px;
    position: relative;
    transition: background 0.2s ease;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    top: 2px;
    left: 2px;
    transition: transform 0.2s ease;
  }

  .view-toggle input:checked + .toggle-slider { background: var(--navy); }
  .view-toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

  /* 快選日曆彈窗 */
  .picker-popup {
    max-width: 300px;
    margin: 0 auto 10px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    padding: 12px;
  }
  .picker-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .picker-nav button { border: none; background: none; font-size: 16px; cursor: pointer; color: var(--navy); }
  .picker-nav .label { font-weight: 700; color: var(--navy); }
  .picker-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 13px; }
  .picker-grid .wd-head { color: #999; font-size: 11px; padding: 4px 0; }
  .picker-grid .day-cell { padding: 6px 0; border-radius: 6px; cursor: pointer; }
  .picker-grid .day-cell:hover { background: #E8EAF6; }
  .picker-grid .day-cell.in-week { background: #E8EAF6; font-weight: 700; }
  .picker-grid .day-cell.empty { visibility: hidden; }

  /* 卡片結構：固定 2 排高度 */
  .event-card {
    background: var(--card-bg);
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    display: grid;
    grid-template-columns: 58px 1fr;
    overflow: hidden;
    border: 1px solid #EAEAEA;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .event-card:hover {
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
  }

  /* 左側日期方塊：僅包含「月」與「日」 */
  .col-date {
    background: var(--navy);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px 0;
  }
  .col-date .month { font-size: 11px; opacity: 0.85; line-height: 1; }
  .col-date .day { font-size: 24px; font-weight: 700; line-height: 1; margin-top: 3px; }

  /* 右側內容區：強制作為兩排絕不折行 */
  .col-main {
    display: flex;
    flex-direction: column;
    padding: 6px 12px;
    justify-content: center;
    gap: 3px;
    min-width: 0; /* 防止子元素溢出 */
  }

  /* 第一排：[週六] [活動] 📍場地 ⏰時間 */
  .row-top {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    white-space: nowrap;
    overflow: hidden;
  }

  .tag-weekday {
    background: var(--navy);
    color: #FFFFFF;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .tag-type {
    font-size: 11px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .meta-info {
    font-size: 12px;
    color: #5f6368;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* 第二排：活動名稱 + 備註（同排顯示） */
  .row-bottom {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: nowrap;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-bottom .title {
    font-size: 15px;
    font-weight: 700;
    color: #111;
    line-height: 1.2;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .row-bottom .note-txt {
    font-size: 13px;
    color: #70757a;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #loading, .empty { text-align: center; padding: 30px 16px; color: #666; font-size: 14px; }

  @media (max-width: 480px) {
    body { padding: 4px; }
    .col-main { padding: 5px 8px; }
    .row-bottom .title { font-size: 14px; }
    .row-bottom .note-txt { font-size: 12px; }
  }
</style>
</head>
<body>

<h1 class="page-title" id="pageTitle">教會全年行事曆</h1>

<div class="month-nav">
  <div class="nav-center">
    <button class="nav-btn" id="prevBtn">‹</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>
  <label class="view-toggle">
    <span class="toggle-txt">週</span>
    <input type="checkbox" id="viewToggle">
    <span class="toggle-slider"></span>
    <span class="toggle-txt">月</span>
  </label>
</div>

<div id="pickerPopup" class="picker-popup" style="display:none;"></div>
<div id="loading">📅 載入行事曆中...</div>
<div id="events-container"></div>

<script>
  // 網址參數傳入 hideTitle=1 時自動隱藏頂部標題
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('hideTitle') === '1') {
    document.getElementById('pageTitle').style.display = 'none';
  }

  const API_URL = "https://script.google.com/macros/s/AKfycbyjxsCWM8-w-BPdvd80ZyE8ruYzwbx-e5z3ked_V2Tyn0tAvGVbHget9qrLZuDH0obl/exec";

  const TYPE_COLORS = {
    '音樂': { bg: '#E0EEF7', fg: '#2C5F8A' },
    '活動': { bg: '#E4F1E6', fg: '#3F7D42' },
    '課程': { bg: '#DCEEEA', fg: '#2F8577' },
    '行政': { bg: '#EAEAEA', fg: '#5B6B73' },
    '週五音樂會': { bg: '#E0EEF7', fg: '#2C5F8A' },
    '例行團契': { bg: '#EAEAEA', fg: '#5B6B73' },
    '大型事工': { bg: '#FCE8E6', fg: '#C5221F' },
    '教會大事記': { bg: '#FEF7E0', fg: '#B06000' },
  };

  function formatTime(t) {
    if (!t) return '';
    const digits = t.toString().padStart(4, '0');
    return `${digits.slice(0, 2)}:${digits.slice(2)}`;
  }

  const FALLBACK_EVENTS = [
    { date: '2026/09/04', weekday: '五', type: '週五音樂會', title: '女高音林蕭淳頤聲樂獨唱會', time: '1930', location: '', description: '', note: '' },
    { date: '2026/09/05', weekday: '六', type: '活動', title: '興隆社宅事工', time: '1930', location: '', description: '主題：手作', note: '' },
    { date: '2026/09/06', weekday: '日', type: '課程', title: '第三季主日學開學', time: '', location: '', description: '', note: '' },
    { date: '2026/09/11', weekday: '五', type: '音樂', title: '平安月詩歌敬拜', time: '1945', location: '', description: '', note: '' },
  ];

  let allEvents = [];
  let weekStart = getMonday(new Date());

  function getMonday(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function addDays(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }
  function fmtMD(date) {
    return `${date.getMonth() + 1}/${date.getDate()}`;
  }
  function toDateKey(date) {
    return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
  }
  function eventsInWeek(monday) {
    const keys = new Set();
    for (let i = 0; i < 7; i++) keys.add(toDateKey(addDays(monday, i)));
    return allEvents.filter(ev => keys.has(ev.date));
  }
  function eventsInMonth(monthAnchor) {
    const y = monthAnchor.getFullYear(), m = monthAnchor.getMonth() + 1;
    return allEvents.filter(ev => {
      const [ey, em] = ev.date.split('/').map(Number);
      return ey === y && em === m;
    });
  }

  function escapeHtml(str) {
    return (str || '').toString()
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function cardsHtml(events) {
    return events.map(ev => {
      const [y, m, d] = ev.date.split('/');
      const color = ev.type ? (TYPE_COLORS[ev.type] || { bg: '#E8EAF6', fg: '#0D184E' }) : null;
      
      // 第一排：[週六] (深藍標籤) + [活動] (類型標籤) + 📍場地 + ⏰時間
      const metaItems = [];
      if (ev.weekday) metaItems.push(`<span class="tag-weekday">週${escapeHtml(ev.weekday)}</span>`);
      if (ev.type) metaItems.push(`<span class="tag-type" style="background:${color.bg};color:${color.fg}">${escapeHtml(ev.type)}</span>`);
      if (ev.location) metaItems.push(`<span class="meta-info">📍 ${escapeHtml(ev.location)}</span>`);
      if (ev.time) metaItems.push(`<span class="meta-info">⏰ ${escapeHtml(formatTime(ev.time))}</span>`);

      // 第二排：活動名稱 + 備註（同排顯示）
      const noteText = ev.description || ev.note || '';

      return `
        <div class="event-card">
          <!-- 左側日期區：僅 9月 + 5 -->
          <div class="col-date">
            <div class="month">${parseInt(m)}月</div>
            <div class="day">${parseInt(d)}</div>
          </div>

          <!-- 右側內容區（絕不折行，固定兩排） -->
          <div class="col-main">
            <!-- 第一排：[週六] [活動] 📍場地 ⏰時間 -->
            <div class="row-top">
              ${metaItems.join('')}
            </div>
            
            <!-- 第二排：活動名稱 + 備註（同排顯示） -->
            <div class="row-bottom">
              <span class="title">${escapeHtml(ev.title)}</span>
              ${noteText ? `<span class="note-txt">${escapeHtml(noteText)}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  let isWeekMode = true;
  let monthAnchor = new Date();

  function render() {
    if (isWeekMode) renderWeekView(); else renderMonthView();
    sendHeightToParent();
  }

  function renderWeekView() {
    const sunday = addDays(weekStart, 6);
    document.getElementById('monthLabel').textContent = `${fmtMD(weekStart)} - ${fmtMD(sunday)}`;

    const events = eventsInWeek(weekStart);
    document.getElementById('prevBtn').disabled = !allEvents.some(ev => ev.date < toDateKey(weekStart));
    document.getElementById('nextBtn').disabled = !allEvents.some(ev => ev.date > toDateKey(sunday));

    const container = document.getElementById('events-container');
    document.getElementById('loading').style.display = 'none';
    container.innerHTML = events.length ? cardsHtml(events) : '<div class="empty">本週未登記重點事工</div>';
  }

  function renderMonthView() {
    document.getElementById('monthLabel').textContent = `${monthAnchor.getFullYear()}年${monthAnchor.getMonth() + 1}月`;

    const events = eventsInMonth(monthAnchor);
    const monthStartKey = toDateKey(new Date(monthAnchor.getFullYear(), monthAnchor.getMonth(), 1));
    const monthEndKey = toDateKey(new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() + 1, 0));
    document.getElementById('prevBtn').disabled = !allEvents.some(ev => ev.date < monthStartKey);
    document.getElementById('nextBtn').disabled = !allEvents.some(ev => ev.date > monthEndKey);

    const container = document.getElementById('events-container');
    document.getElementById('loading').style.display = 'none';
    container.innerHTML = events.length ? cardsHtml(events) : '<div class="empty">本月未登記重點事工</div>';
  }

  document.getElementById('viewToggle').addEventListener('change', (e) => {
    const switchingToMonth = e.target.checked;
    if (switchingToMonth) {
      const sunday = addDays(weekStart, 6);
      monthAnchor = new Date(sunday.getFullYear(), sunday.getMonth(), 1);
    } else {
      weekStart = getMonday(monthAnchor);
    }
    isWeekMode = !switchingToMonth;
    render();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (isWeekMode) { weekStart = addDays(weekStart, -7); }
    else { monthAnchor = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() - 1, 1); }
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (isWeekMode) { weekStart = addDays(weekStart, 7); }
    else { monthAnchor = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() + 1, 1); }
    render();
  });

  // ---------- 日曆快選彈窗 ----------
  let pickerMonth = new Date(weekStart);
  const popup = document.getElementById('pickerPopup');

  function renderPicker() {
    const y = pickerMonth.getFullYear(), m = pickerMonth.getMonth();
    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const sunday = addDays(weekStart, 6);

    let cells = '';
    for (let i = 0; i < firstDay; i++) cells += `<div class="day-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const cellDate = new Date(y, m, d);
      const inWeek = isWeekMode
        ? (cellDate >= weekStart && cellDate <= sunday)
        : (y === monthAnchor.getFullYear() && m === monthAnchor.getMonth());
      cells += `<div class="day-cell ${inWeek ? 'in-week' : ''}" data-y="${y}" data-m="${m}" data-d="${d}">${d}</div>`;
    }

    popup.innerHTML = `
      <div class="picker-nav">
        <button id="pickerPrev">‹</button>
        <span class="label">${y}年${m + 1}月</span>
        <button id="pickerNext">›</button>
      </div>
      <div class="picker-grid">
        <div class="wd-head">日</div><div class="wd-head">一</div><div class="wd-head">二</div>
        <div class="wd-head">三</div><div class="wd-head">四</div><div class="wd-head">五</div><div class="wd-head">六</div>
        ${cells}
      </div>
    `;
    popup.querySelector('#pickerPrev').addEventListener('click', () => {
      pickerMonth = new Date(y, m - 1, 1);
      renderPicker();
    });
    popup.querySelector('#pickerNext').addEventListener('click', () => {
      pickerMonth = new Date(y, m + 1, 1);
      renderPicker();
    });
    popup.querySelectorAll('.day-cell:not(.empty)').forEach(cell => {
      cell.addEventListener('click', () => {
        const picked = new Date(+cell.dataset.y, +cell.dataset.m, +cell.dataset.d);
        if (isWeekMode) weekStart = getMonday(picked);
        else monthAnchor = new Date(picked.getFullYear(), picked.getMonth(), 1);
        popup.style.display = 'none';
        render();
      });
    });
  }

  document.getElementById('monthLabel').addEventListener('click', () => {
    const showing = popup.style.display !== 'none';
    if (showing) {
      popup.style.display = 'none';
    } else {
      pickerMonth = isWeekMode ? new Date(weekStart) : new Date(monthAnchor);
      renderPicker();
      popup.style.display = 'block';
    }
  });

  window.addEventListener('resize', () => {
    sendHeightToParent();
  });

  function sendHeightToParent() {
    if (window.parent && window.parent !== window) {
      const height = document.documentElement.scrollHeight || document.body.scrollHeight;
      window.parent.postMessage({ type: 'CALENDAR_RESIZE', height: height }, '*');
    }
  }

  function init(events) {
    allEvents = events;
    if (events.length) {
      const firstDate = new Date(events[0].date.replace(/\//g, '-'));
      weekStart = getMonday(firstDate);
      monthAnchor = new Date(firstDate.getFullYear(), firstDate.getMonth(), 1);
    }
    render();
  }

  if (API_URL) {
    fetch(API_URL)
      .then(res => res.json())
      .then(init)
      .catch(err => {
        console.error('無法載入資料:', err);
        document.getElementById('loading').innerHTML = '❌ 載入失敗，請確認網址是否正確';
      });
  } else {
    init(FALLBACK_EVENTS);
  }
</script>

</body>
</html>
